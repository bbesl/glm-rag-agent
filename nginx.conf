# Nginx 反向代理配置样例
# 放在 /etc/nginx/sites-available/cs-api（Ubuntu）
# 启用：ln -s /etc/nginx/sites-available/cs-api /etc/nginx/sites-enabled/
# 检查：nginx -t   重载：nginx -s reload

server {
    listen 80;
    server_name your-domain.com;

    # 请求体大小（LLM 对话消息一般不大，但保险起见）
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ LLM 调用耗时较长，Nginx 默认 60s 超时会切断连接
        # FastAPI /chat 路由单次请求可能要 10-20s（LLM API 调用）
        # 设置 120s 留足余量
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # 健康检查也走代理（方便外部监控）
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;   # 健康检查请求不进访问日志，避免刷屏
    }
}

# HTTPS 配置（生产必备，用 certbot 一键申请 Let's Encrypt 证书）
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d your-domain.com
# certbot 会自动在上面配置里加 SSL 相关行，不用手写
